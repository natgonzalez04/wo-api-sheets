<!DOCTYPE html>
<html>
    <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway&display=swap" rel="stylesheet">
    </head>
    <body>

            <section class="containerCatalogoBase">
                <section class="titleCatalogo">
                    <span style="font-style: italic; color: #5a5a5a; font-weight: 400;">**Devuelve el costo promedio de un producto</span>
                </section>

                <section class="titleCatalogo">
                    <span>Ingresa el codigo del inventario </span>
                </section>

                <section class="containerPaginacionDocumentos">

                    <div style="margin-bottom: 30px; margin-top: 15px; font-weight: 600;">
                        <label for="codigoInventario"><strong>Código inventario*:</strong>
                            <input type="text" name="codigoInventario" id="codigoInventario" value="">
                        </label>
                    </div>
                </section>


                <section class="optionsData">
                    
                    <div class="mensajeErrorSinConsulta">
                        <span>Por favor, selecciona al menos una cuenta contable</span>
                    </div>
                    <button type="button" class="buttonImport" onclick="sendDataSelected()">Agregar</button>
                </section>
            </section>

            <div id="loading" class="loading" style="display: none;">
                <div class="d-flex justify-content-center align-items-end">
                        <div class="spinner-grow" style="width: 1rem; height: 1rem" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>   
                        <div class="spinner-grow " style="width: 2rem; height: 2em" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>   
                        <div class="spinner-grow" style="width: 3rem; height: 3rem" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>   
                </div>
                <p style=" margin-top: 3vh; font-weight: 600; color: #0d95f0;">Cargando datos</p>
            </div>
        
            <script>

                    var tabla = document.getElementById('miTabla');
                    var optionsExit = document.getElementsByName('option');
                    var optionChecked = document.querySelector('input[name="option"]:checked');
                    var contenedorGlobal = document.querySelector('.containerCatalogoBase');
                    var contenedorLoading = document.querySelector('.loading');
                    var containerBase = document.querySelector('.containerCatalogo');
                    var numeroCuenta = document.getElementById('numeroCuenta');
                    var selectNaturalezaCuenta = document.getElementById('naturalezaCuenta');
                    var containerAllSeleccion = document.querySelector('.optionAll');
                    var mensajeErrorSinConsulta = document.querySelector('.mensajeErrorSinConsulta');
                    var optionData = document.querySelector('.optionsData');
                    var containerFiltrosSaldo = document.querySelector('.containerFiltrosSaldo');
                    var btnConsulta = document.getElementById('contenedorButtonConsulta');
                    var mensajeErrorInicial = document.querySelector('.mensajeErrorInicial');
                    var selectOptionSend;
                    var selecciones = [];
                    var resulAll = [];

        
                    contenedorGlobal.style.display = 'flex';
                    containerAllSeleccion.style.display = 'none';
                    mensajeErrorInicial.style.display = 'none';
                    containerBase.style.display = 'none';
                    contenedorLoading.style.display = 'none';
                    optionData.style.display = 'none';
                    containerFiltrosSaldo.style.display = 'none';


                    var optionSelecciona = document.createElement('option');
                        optionSelecciona.value = "";
                        optionSelecciona.text = "Selecciona";
                        optionSelecciona.disabled = true;
                        optionSelecciona.selected = true;
                        selectNaturalezaCuenta.insertBefore(optionSelecciona, selectNaturalezaCuenta.firstChild);

                    for (var i = 0; i < tiposCuenta.length; i++) {
                        var option = document.createElement('option');
                        option.value = tiposCuenta[i].nombreTipo;
                        option.text = tiposCuenta[i].nombreTipo;
                        selectNaturalezaCuenta.appendChild(option);
                    }

                    selectNaturalezaCuenta.addEventListener('change', function() {
                        numeroCuenta.value = null;
                        containerAllSeleccion.style.display = 'none';
                        containerBase.style.display = 'none';
                        optionData.style.display = 'none';
                        containerFiltrosSaldo.style.display = 'none';
                        btnConsulta.style.display = 'flex';

                    });

                    numeroCuenta.addEventListener('input', function(e) {
                        if(e.target.value){
                            selectNaturalezaCuenta.disabled = true;
                        }else{
                            selectNaturalezaCuenta.disabled = false;
                        }
                    });

                    function guardarValidacionInicial(){

                        if(numeroCuenta.value || selectNaturalezaCuenta.value){
                        
                        // mensajeError.style.display = 'none';
                        var seleccionCuentaSelect = {
                            categoriaDocumento: selectNaturalezaCuenta.value,
                            numeroCuenta: numeroCuenta.value,
                        };

                        google.script.run.guardarSeleccionGeneralCuenta(seleccionCuentaSelect);
                            return true;
                        }else{
                            return false;
                        }
                    }

                    numeroCuenta.onchange = guardarValidacionInicial;
                    selectNaturalezaCuenta.onchange = guardarValidacionInicial;


                    function consultaDataInicial(){
                        var camposValidados = guardarValidacionInicial();
                        console.log(camposValidados);
                        if(camposValidados){  
                            mensajeErrorInicial.style.display = 'flex';
                            google.script.run.withSuccessHandler(function(result) {

                                google.script.run.withSuccessHandler(function(result) {
                                    console.log(result);
                                    if(result.length > 0){

                                        mensajeErrorInicial.style.display = 'none';
                                        containerBase.style.display = 'flex';
                                        containerAllSeleccion.style.display = 'flex';
                                        optionData.style.display = 'block';
                                        containerFiltrosSaldo.style.display = 'flex';
                                        tabla.innerHTML = '';
                                        resulAll = result;

                                        result.forEach(function(elemento) {
                                            btnConsulta.style.display = 'none';
                                            var fila = document.createElement('tr');
                                            var celda = document.createElement('td');
                                            celda.textContent = `${elemento.codigo} ${' '} ${elemento.nombre}`;
                                            celda.classList.add('celdaTabla');
                                            fila.appendChild(celda);
                                            fila.classList.add('filaTabla');
                                            fila.addEventListener('click', clickCell);
                                            tabla.appendChild(fila);

                                        });

                                    }
                                    

                                }).getDataCuentaContable();
                        
                            }).withFailureHandler(function(error) {
                                google.script.host.close();
                            }).consultaCuentasInicial();
                        }

                    }

                    document.getElementById('addAllCheckbox').addEventListener('change', function(e) {
                        if (e.target.checked) {
                            
                            var dataResult = [...resulAll];

                            selecciones = dataResult.map(function(elemento) {
                                return elemento.codigo + ' ' + elemento.nombre;
                            });
                            var cells = document.querySelectorAll('td');
                            for (var i = 0; i < cells.length; i++) {
                                cells[i].classList.add('selectedCelda');
                            }

                        } else {
                            selecciones = [];
                            var cells = document.querySelectorAll('td');
                            for (var i = 0; i < cells.length; i++) {
                                cells[i].classList.remove('selectedCelda');
                            }
                        }
                        selecciones = selecciones.map(function(seleccion) {
                            return seleccion.split(/\s(.+)/);
                        });
                        google.script.run.guardarSeleccionCuentaContable(selecciones);
                    });

                    if (optionChecked) {
                        selectOptionSend = optionChecked.value;
                        google.script.run.guardarSeleccionOpcionCuentaContable(selectOptionSend);
                    }

                    for(var i = 0; i < optionsExit.length; i++) {
                        optionsExit[i].addEventListener('change', function() {
                            selectOptionSend = this.value;
                            google.script.run.guardarSeleccionOpcionCuentaContable(selectOptionSend);
                        });
                    }

                    function clickCell(evento) {
                        var seleccion = evento.target.textContent;
                        var seleccionArray = seleccion.split('   ');

                        var isInArray = selecciones.some(function(elemento) {
                            return elemento.join('   ') === seleccionArray.join('   ');
                        });

                        if (isInArray) {
                            selecciones = selecciones.filter(function(elemento) {
                                return elemento.join('   ') !== seleccionArray.join('   ');
                            });
                            evento.target.classList.remove('selectedCelda');
                        } else {
                            selecciones.push(seleccionArray);
                            mensajeErrorSinConsulta.style.display = 'none';
                            evento.target.classList.add('selectedCelda');
                        }
                        console.log(selecciones,'selecciones');
                        google.script.run.guardarSeleccionCuentaContable(selecciones);
                    }

                    function sendDataSelected() {
                        if(selecciones.length === 0) {
                            mensajeErrorSinConsulta.style.display = 'flex';
                        }else{
                            contenedorGlobal.style.display = 'none';
                            contenedorLoading.style.display = 'flex';

                            google.script.run.withSuccessHandler(function(result) {
                                google.script.host.close();
                            }).withFailureHandler(function(error) {
                                google.script.host.close();
                            }).mostrarDatosCeldaCuentaContable();
                        }
                        
                    }

            </script>
    </body>
</html>
